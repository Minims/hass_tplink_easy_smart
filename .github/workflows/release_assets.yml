name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build HACS archive
        run: zip -r tplink_easy_smart.zip custom_components/tplink_easy_smart

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: tplink_easy_smart.zip
